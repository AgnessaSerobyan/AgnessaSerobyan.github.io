<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forma — Product flow prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#e2e8e2;color:#293d3e;font:16px/1.6 Arial,sans-serif}main{max-width:470px;margin:30px auto;background:#faf8f1;border-radius:30px;padding:30px}h1{font-size:42px;line-height:1.05;letter-spacing:-2px}p{color:#57655f}.object{padding:30px;background:#d6dfcb;border-radius:22px;margin:25px 0;text-align:center}.object svg{width:80%;height:220px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 20px;background:#34594f;color:white;min-height:48px}.swatch{width:48px;height:48px;border:3px solid transparent;border-radius:50%;padding:0;margin-right:8px}.swatch[aria-pressed=true]{outline:2px solid #34594f;outline-offset:3px}small{display:block;color:#57655f;margin-top:25px}@media(max-width:520px){main{margin:0;border-radius:0;min-height:100dvh}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><main><small>FORMA / INTERACTIVE STUDY</small><h1 id="title">A little more room for everyday.</h1><div class="object" id="object"><svg viewBox="0 0 300 230" aria-label="Arc vessel"><path d="M70 210V100a80 80 0 0 1 160 0v110Z" fill="#768d70"/><path d="M110 210V105a40 40 0 0 1 80 0v105Z" fill="#d6dfcb"/></svg></div><p id="copy">Meet Arc, an original object study. Explore a simple product-selection flow.</p><div id="choices" hidden><p>Choose a finish</p><button class="swatch" aria-label="Sage finish" aria-pressed="true" data-colour="Sage" style="background:#768d70"></button><button class="swatch" aria-label="Clay finish" aria-pressed="false" data-colour="Clay" style="background:#b97f62"></button><button class="swatch" aria-label="Chalk finish" aria-pressed="false" data-colour="Chalk" style="background:#d6d0bc"></button><p id="finish" role="status">Sage selected</p></div><button id="next">Explore Arc</button><small>Local prototype · Demonstration design only.<br>No purchase, payment or external request is made.</small><p><a href="/interface-studies/studies/archive/index.html">Back to ARCHIVE</a></p></main><script>let step=0,colour='Sage';const q=s=>document.querySelector(s);document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{colour=b.dataset.colour;document.querySelectorAll('[data-colour]').forEach(x=>x.setAttribute('aria-pressed',x===b));q('#finish').textContent=colour+' selected';q('#object svg path').setAttribute('fill',b.style.background);});q('#next').onclick=()=>{step=(step+1)%3;q('#title').textContent=['A little more room for everyday.','Make it yours.','A thoughtful choice.'][step];q('#copy').textContent=['Meet Arc, an original object study. Explore a simple product-selection flow.','Pick a finish to explore the product direction.','Arc in '+colour+' has been added to this prototype collection.'][step];q('#choices').hidden=step!==1;q('#next').textContent=['Explore Arc','Add to collection','Start again'][step];};</script></html>
